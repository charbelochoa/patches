  <style id="kids-loader-style">
    #kids-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: radial-gradient(circle at 50% 35%, #FFF9D2 0%, #B8ECFF 52%, #7CCBFF 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: "Arial Rounded MT Bold", "Nunito", "Fredoka", system-ui, -apple-system, sans-serif;
      transition: transform 0.55s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.45s ease;
    }
    #kids-loader.kl-exit {
      transform: scale(1.22);
      opacity: 0;
      pointer-events: none;
    }
    /* Sunburst rays in background */
    .kl-rays {
      position: absolute;
      width: 200vmax;
      height: 200vmax;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 255, 255, 0.28) 0deg 12deg,
        transparent 12deg 24deg
      );
      animation: kl-spin 22s linear infinite;
      pointer-events: none;
    }
    /* Floating cartoon clouds & stars */
    .kl-cloud {
      position: absolute;
      fill: #FFFFFF;
      opacity: 0.88;
      filter: drop-shadow(0 6px 0 rgba(0, 115, 177, 0.12));
      animation: kl-float 4s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .kl-c1 { width: 130px; top: 8%; left: 6%; animation-duration: 3.6s; }
    .kl-c2 { width: 110px; top: 14%; right: 6%; animation-duration: 4.4s; animation-delay: -1.5s; }
    .kl-c3 { width: 95px; bottom: 16%; left: 8%; animation-duration: 4.1s; animation-delay: -0.8s; }
    .kl-c4 { width: 115px; bottom: 20%; right: 7%; animation-duration: 3.8s; animation-delay: -2.2s; }

    /* Bouncy 3D Cartoon Letters */
    .kl-title {
      position: relative;
      z-index: 3;
      display: flex;
      gap: 4px;
      margin-bottom: 18px;
      perspective: 500px;
    }
    .kl-let {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 54px;
      border-radius: 14px;
      font-size: 32px;
      font-weight: 900;
      color: #FFFFFF;
      border: 3.5px solid #22252A;
      box-shadow: 0 6px 0 #22252A, inset 0 4px 0 rgba(255,255,255,0.45);
      text-shadow: 0 2px 0 rgba(0,0,0,0.3);
      animation: kl-letter-bounce 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .kl-let:nth-child(1) { background: #E40101; animation-delay: 0.00s; transform: rotate(-5deg); }
    .kl-let:nth-child(2) { background: #EF6C00; animation-delay: 0.10s; transform: rotate(3deg); }
    .kl-let:nth-child(3) { background: #C49000; animation-delay: 0.20s; transform: rotate(-3deg); }
    .kl-let:nth-child(4) { background: #00A651; animation-delay: 0.30s; transform: rotate(4deg); }
    .kl-let:nth-child(5) { background: #00AFFF; animation-delay: 0.40s; transform: rotate(-4deg); }
    .kl-let:nth-child(6) { background: #7C4DFF; animation-delay: 0.50s; transform: rotate(3deg); }
    .kl-let:nth-child(7) { background: #E91E63; animation-delay: 0.60s; transform: rotate(-4deg); }

    /* Cartoon Stage SVG */
    .kl-stage-wrap {
      position: relative;
      z-index: 3;
      width: min(310px, 82vw);
      height: min(310px, 82vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kl-stage-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 14px 20px rgba(0, 60, 110, 0.22));
    }

    /* Animated Patch Mascots jumping into the board */
    .kl-board-group {
      transform-origin: 150px 150px;
      animation: kl-board-pop 3s ease-in-out infinite;
    }
    .kl-mascot-red {
      transform-origin: 115px 80px;
      animation: kl-hop-tl 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .kl-mascot-orange {
      transform-origin: 220px 115px;
      animation: kl-hop-tr 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .kl-mascot-green {
      transform-origin: 80px 185px;
      animation: kl-hop-bl 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .kl-mascot-blue {
      transform-origin: 185px 220px;
      animation: kl-hop-br 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .kl-mascot-purple {
      transform-origin: 150px 150px;
      animation: kl-hop-center 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .kl-eyes {
      transform-origin: center;
      animation: kl-blink 2.4s infinite;
    }
    .kl-star-burst {
      transform-origin: 150px 150px;
      animation: kl-stars-pop 3s ease-out infinite;
    }

    /* Candy-striped kids game loading bar */
    .kl-bar-shell {
      position: relative;
      z-index: 3;
      width: min(260px, 74vw);
      height: 26px;
      background: #FFFFFF;
      border: 4px solid #22252A;
      border-radius: 999px;
      padding: 2px;
      box-shadow: 0 6px 0 #22252A;
      margin-top: 14px;
      overflow: hidden;
    }
    .kl-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: repeating-linear-gradient(
        -45deg,
        #00A651 0px 14px,
        #2ECC71 14px 28px
      );
      background-size: 40px 40px;
      box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.45);
      animation:
        kl-bar-load 2.7s cubic-bezier(0.25, 0.9, 0.35, 1) forwards,
        kl-stripes 0.7s linear infinite;
    }

    @keyframes kl-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes kl-float {
      from { transform: translateY(-8px) scale(0.98); }
      to { transform: translateY(8px) scale(1.03); }
    }
    @keyframes kl-letter-bounce {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(-14px) scale(0.92, 1.12); }
      55% { transform: translateY(3px) scale(1.12, 0.88); }
      75% { transform: translateY(-4px) scale(0.97, 1.03); }
    }
    @keyframes kl-board-pop {
      0% { transform: scale(0.85) rotate(-3deg); }
      20% { transform: scale(1.03) rotate(1deg); }
      70% { transform: scale(1) rotate(0deg); }
      82% { transform: scale(1.08) rotate(-2deg); }
      92%, 100% { transform: scale(1) rotate(0deg); }
    }
    @keyframes kl-hop-tl {
      0%, 8% { transform: translate(-90px, -85px) rotate(-28deg) scale(0.6); opacity: 0; }
      26% { transform: translate(6px, 6px) rotate(6deg) scale(1.08, 0.9); opacity: 1; }
      36%, 78% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      85% { transform: translate(0, -8px) scale(1.05); opacity: 1; }
      95%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @keyframes kl-hop-tr {
      0%, 18% { transform: translate(95px, -80px) rotate(30deg) scale(0.6); opacity: 0; }
      36% { transform: translate(-6px, 6px) rotate(-6deg) scale(0.9, 1.08); opacity: 1; }
      46%, 78% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      86% { transform: translate(0, -8px) scale(1.05); opacity: 1; }
      95%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @keyframes kl-hop-bl {
      0%, 28% { transform: translate(-95px, 85px) rotate(-25deg) scale(0.6); opacity: 0; }
      46% { transform: translate(6px, -6px) rotate(5deg) scale(0.9, 1.08); opacity: 1; }
      56%, 78% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      87% { transform: translate(0, -8px) scale(1.05); opacity: 1; }
      95%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @keyframes kl-hop-br {
      0%, 38% { transform: translate(95px, 85px) rotate(25deg) scale(0.6); opacity: 0; }
      56% { transform: translate(-6px, -6px) rotate(-5deg) scale(1.08, 0.9); opacity: 1; }
      66%, 78% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      88% { transform: translate(0, -8px) scale(1.05); opacity: 1; }
      95%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @keyframes kl-hop-center {
      0%, 48% { transform: translate(0, -130px) scale(0.4) rotate(180deg); opacity: 0; }
      68% { transform: translate(0, 6px) scale(1.18, 0.84) rotate(0deg); opacity: 1; }
      78% { transform: translate(0, 0) scale(1); opacity: 1; }
      85% { transform: translate(0, -10px) scale(1.1); opacity: 1; }
      95%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }
    @keyframes kl-blink {
      0%, 44%, 50%, 94%, 100% { transform: scaleY(1); }
      47%, 97% { transform: scaleY(0.12); }
    }
    @keyframes kl-stars-pop {
      0%, 66% { transform: scale(0.3); opacity: 0; }
      78% { transform: scale(1.15); opacity: 1; }
      92% { transform: scale(1.28); opacity: 0.9; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    @keyframes kl-bar-load {
      0% { width: 6%; }
      35% { width: 42%; }
      70% { width: 82%; }
      100% { width: 100%; }
    }
    @keyframes kl-stripes {
      from { background-position: 0 0; }
      to { background-position: 40px 0; }
    }
  </style>
</head>

  <script>
    (function setupKidsLoader() {
      const loader = document.getElementById("kids-loader");
      if (!loader) return;
      let dismissed = false;
      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        loader.classList.add("kl-exit");
        setTimeout(() => {
          loader.remove();
          document.getElementById("kids-loader-style")?.remove();
        }, 560);
      }
      loader.addEventListener("click", dismiss);
      setTimeout(dismiss, 2750);
    })();
  </script>
